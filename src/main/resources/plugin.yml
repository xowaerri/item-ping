name: ItemPing
version: 1.1.0
main: org.xowa.itemping.ItemPing
api-version: '1.21'

commands:
  pingcolor:
    description: Изменяет цвет ping'а предметов
    usage: /<command> [цвет/random]
    aliases: [pcolor, itemcolor]
    permission: itemping.command.color

permissions:
  itemping.command.color:
    default: true
